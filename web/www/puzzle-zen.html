<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5BA3B8">
    <title>Puzzle Zen - Wellness Mental</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/puzzle-zen.css">
    <link rel="apple-touch-icon" href="images/app-icon.jpeg">
    <link rel="icon" type="image/jpeg" href="images/app-icon.jpeg">
    <link rel="shortcut icon" href="images/app-icon.jpeg">
</head>
<body>
    <div id="app">
        <!-- Puzzle Zen Game Screen -->
        <div id="puzzle-zen-screen" class="screen active">
            <div class="puzzle-zen-container">
                <header class="game-header">
                    <button id="back-to-games" class="btn btn-secondary btn-small">
                        ← Volver
                    </button>
                    <h1>Puzzle Zen</h1>
                    <div class="game-stats">
                        <span class="stat">🎯 <span id="level">1</span></span>
                    </div>
                </header>

                <!-- Game Info -->
                <div class="game-info">
                    <p id="game-status">Memoriza el patrón y repítelo</p>
                </div>

                <!-- Game Board -->
                <div class="puzzle-board-container">
                    <div class="puzzle-board" id="puzzle-board">
                        <div class="level-display" id="level-display">Nivel 1</div>
                        <div class="circle circle-0" data-index="0"></div>
                        <div class="circle circle-1" data-index="1"></div>
                        <div class="circle circle-2" data-index="2"></div>
                        <div class="circle circle-3" data-index="3"></div>
                    </div>
                </div>

                <!-- Game Controls -->
                <div class="game-controls">
                    <button id="start-btn" class="btn btn-primary">
                        ▶️ Iniciar
                    </button>
                    <button id="restart-btn" class="btn btn-secondary hidden">
                        � Reiniciar
                    </button>
                </div>

                <!-- Game Complete Modal -->
                <div id="game-complete-modal" class="modal hidden">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>¡Juego Terminado!</h2>
                            <button class="btn-close">×</button>
                        </div>
                        <div class="game-complete-content">
                            <div class="complete-icon">�</div>
                            <div class="complete-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Nivel Alcanzado</span>
                                    <span class="stat-value" id="final-level">1</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Puntos</span>
                                    <span class="stat-value" id="final-points">+50</span>
                                </div>
                            </div>
                            <p class="complete-message">¡Excelente memoria! Has completado el Puzzle Zen.</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-secondary close-modal-btn">Cerrar</button>
                            <button class="btn btn-primary restart-modal-btn">Jugar de Nuevo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/game-fx-engine.js"></script>
    <script src="js/puzzle-zen.js"></script>
</body>
</html>
