<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5BA3B8">
    <title>Puzzle Zen - Wellness Mental</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/puzzle-zen.css">
</head>
<body>
    <div id="app">
        <!-- Puzzle Zen Game Screen -->
        <div id="puzzle-zen-screen" class="screen active">
            <div class="puzzle-zen-container">
                <header class="game-header">
                    <button id="back-to-games" class="btn btn-secondary btn-small">
                        ← Volver
                    </button>
                    <h1>Puzzle Zen</h1>
                    <div class="game-stats">
                        <span class="stat">⏱️ <span id="timer">0:00</span></span>
                        <span class="stat">🧩 <span id="moves">0</span></span>
                    </div>
                </header>

                <!-- Game Info -->
                <div class="game-info">
                    <p>Ordena los números del 1 al 8. Desliza las piezas para resolver el puzzle.</p>
                </div>

                <!-- Difficulty Selection -->
                <div class="difficulty-selection">
                    <button class="difficulty-btn active" data-size="3">3x3</button>
                    <button class="difficulty-btn" data-size="4">4x4</button>
                </div>

                <!-- Game Board -->
                <div class="puzzle-board" id="puzzle-board">
                    <!-- Tiles will be generated by JS -->
                </div>

                <!-- Game Controls -->
                <div class="game-controls">
                    <button id="shuffle-btn" class="btn btn-primary">
                        🔀 Mezclar
                    </button>
                    <button id="solve-btn" class="btn btn-secondary">
                        💡 Resolver
                    </button>
                </div>

                <!-- Game Complete Modal -->
                <div id="game-complete-modal" class="modal hidden">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>¡Puzzle Resuelto!</h2>
                            <button class="btn-close">×</button>
                        </div>
                        <div class="game-complete-content">
                            <div class="complete-icon">🧩</div>
                            <div class="complete-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Tiempo</span>
                                    <span class="stat-value" id="final-time">0:00</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Movimientos</span>
                                    <span class="stat-value" id="final-moves">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Puntos</span>
                                    <span class="stat-value" id="final-points">+75</span>
                                </div>
                            </div>
                            <p class="complete-message">¡Excelente! Has resuelto el puzzle zen.</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-secondary close-modal-btn">Cerrar</button>
                            <button class="btn btn-primary restart-modal-btn">Jugar de Nuevo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/puzzle-zen.js"></script>
</body>
</html>
