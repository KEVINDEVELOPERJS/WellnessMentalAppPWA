<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5BA3B8">
    <title>Calma Match - Wellness Mental</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/calma-match.css">
    <link rel="apple-touch-icon" href="images/app-icon.jpeg">
    <link rel="icon" type="image/jpeg" href="images/app-icon.jpeg">
    <link rel="shortcut icon" href="images/app-icon.jpeg">
</head>
<body>
    <div id="app">
        <!-- Calma Match Game Screen -->
        <div id="calma-match-screen" class="screen active">
            <div class="calma-match-container">
                <header class="game-header">
                    <button id="back-to-games" class="btn btn-secondary btn-small">
                        ← Volver
                    </button>
                    <h1>Calma Match</h1>
                    <div class="game-stats">
                        <span class="stat">⭐ <span id="score">0</span></span>
                        <span class="stat">🔥 <span id="combo">0</span></span>
                        <span class="stat">⏱️ <span id="timer">1:30</span></span>
                    </div>
                </header>

                <!-- Game Info -->
                <div class="game-info">
                    <p>Intercambia gemas adyacentes para crear grupos de 3 o más. ¡Relájate y diviértete!</p>
                </div>

                <!-- Game Board -->
                <div class="game-board-container">
                    <div class="game-board" id="game-board">
                        <!-- Cells will be generated by JS -->
                    </div>
                </div>

                <!-- Game Controls -->
                <div class="game-controls">
                    <button id="start-btn" class="btn btn-primary">
                        ▶️ Iniciar Juego
                    </button>
                    <button id="restart-btn" class="btn btn-secondary hidden">
                        🔄 Reiniciar
                    </button>
                </div>

                <!-- Game Complete Modal -->
                <div id="game-complete-modal" class="modal hidden">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>¡Juego Completado!</h2>
                            <button class="btn-close">×</button>
                        </div>
                        <div class="game-complete-content">
                            <div class="complete-icon">🎉</div>
                            <div class="complete-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Puntos</span>
                                    <span class="stat-value" id="final-score">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Combo Máximo</span>
                                    <span class="stat-value" id="final-combo">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Puntos Ganados</span>
                                    <span class="stat-value" id="final-points">+50</span>
                                </div>
                            </div>
                            <p class="complete-message">¡Excelente trabajo! Has completado el juego Calma Match.</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-secondary close-modal-btn">Cerrar</button>
                            <button class="btn btn-primary restart-modal-btn">Jugar de Nuevo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/calma-match.js"></script>
</body>
</html>
