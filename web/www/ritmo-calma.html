<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5BA3B8">
    <title>Ritmo Calma - Wellness Mental</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ritmo-calma.css">
    <link rel="apple-touch-icon" href="images/app-icon.jpeg">
    <link rel="icon" type="image/jpeg" href="images/app-icon.jpeg">
    <link rel="shortcut icon" href="images/app-icon.jpeg">
</head>
<body>
    <div id="app">
        <!-- Ritmo Calma Game Screen -->
        <div id="ritmo-calma-screen" class="screen active">
            <div class="ritmo-calma-container">
                <header class="game-header">
                    <button id="back-to-games" class="btn btn-secondary btn-small">
                        ← Volver
                    </button>
                    <h1>Ritmo Calma</h1>
                    <div class="game-stats">
                        <span class="stat">⭐ <span id="score">0</span></span>
                        <span class="stat">🔥 <span id="combo">0</span></span>
                        <span class="stat">⏱️ <span id="timer">1:30</span></span>
                    </div>
                </header>

                <!-- Game Info -->
                <div class="game-info">
                    <p id="game-status">Toca cuando el indicador esté en la zona verde</p>
                </div>

                <!-- Game Board -->
                <div class="game-board-container">
                    <div class="game-board" id="game-board">
                        <svg class="game-board-svg" viewBox="0 0 300 300">
                            <defs>
                                <linearGradient id="zoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
                                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8" />
                                </linearGradient>
                            </defs>
                            <!-- Target zone arc (90 degrees) -->
                            <path id="target-zone" class="target-zone-arc" d="M 150 30 A 120 120 0 0 1 270 150" fill="none" stroke="url(#zoneGradient)" stroke-width="16" stroke-linecap="round" />
                            <!-- Central orb -->
                            <circle id="central-orb" class="central-orb" cx="150" cy="150" r="66" />
                            <!-- Combo text -->
                            <text id="combo-text" class="combo-text" x="150" y="210" text-anchor="middle">COMBO x0</text>
                            <!-- Feedback text -->
                            <text id="feedback-text" class="feedback-text-svg" x="150" y="130" text-anchor="middle"></text>
                        </svg>
                        <div class="indicator" id="indicator"></div>
                    </div>
                </div>

                <!-- Game Controls -->
                <div class="game-controls">
                    <button id="start-btn" class="btn btn-primary">
                        ▶️ Iniciar
                    </button>
                    <button id="restart-btn" class="btn btn-secondary hidden">
                        🔄 Reiniciar
                    </button>
                </div>

                <!-- Game Complete Modal -->
                <div id="game-complete-modal" class="modal hidden">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>¡Sesión Completada!</h2>
                            <button class="btn-close">×</button>
                        </div>
                        <div class="game-complete-content">
                            <div class="complete-icon">🧘</div>
                            <div class="complete-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Puntos</span>
                                    <span class="stat-value" id="final-score">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Combo Máximo</span>
                                    <span class="stat-value" id="final-combo">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Perfectos</span>
                                    <span class="stat-value" id="final-perfect">0</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Puntos Ganados</span>
                                    <span class="stat-value" id="final-points">+50</span>
                                </div>
                            </div>
                            <p class="complete-message">¡Excelente trabajo! Has completado la sesión de ritmo calma.</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-secondary close-modal-btn">Cerrar</button>
                            <button class="btn btn-primary restart-modal-btn">Jugar de Nuevo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Cargando...</p>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toast-message"></span>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/game-fx-engine.js"></script>
    <script src="js/ritmo-calma.js"></script>
</body>
</html>
