<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Alertas Psicólogo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        pre {
            background: white;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test: Módulo de Alertas para Psicólogos</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        function addCode(code) {
            const pre = document.createElement('pre');
            pre.textContent = code;
            results.appendChild(pre);
        }
        
        // Test 1: Check if AlertsModule exists
        addResult('Test 1: Verificar si AlertsModule existe...', 'info');
        
        // Load alerts.js dynamically
        const script = document.createElement('script');
        script.src = 'js/alerts.js';
        script.onload = () => {
            if (typeof AlertsModule !== 'undefined') {
                addResult('✓ AlertsModule cargado correctamente', 'success');
                
                // Test 2: Check methods
                addResult('Test 2: Verificar métodos de AlertsModule...', 'info');
                const methods = [
                    'init', 'loadHubUrl', 'syncAndLoad', 'showAlerts',
                    'showAlertDetail', 'markAsResolved', 'markAsPending',
                    'saveNotes', 'showHubConfigModal', 'hideHubConfigModal'
                ];
                
                methods.forEach(method => {
                    if (typeof AlertsModule[method] === 'function') {
                        addResult(`✓ Método '${method}' existe`, 'success');
                    } else {
                        addResult(`✗ Método '${method}' no existe`, 'error');
                    }
                });
                
                // Test 3: Check HTML structure
                addResult('Test 3: Verificar estructura HTML...', 'info');
                const elements = [
                    'alerts-toolbar', 'sync-warning', 'alerts-header-card',
                    'alerts-list', 'alert-detail-modal', 'hub-config-modal'
                ];
                
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        addResult(`✓ Elemento '${id}' existe`, 'success');
                    } else {
                        addResult(`✗ Elemento '${id}' no existe (esto es normal si no estás en alerts.html)', 'error');
                    }
                });
                
                // Test 4: Simulate alert data
                addResult('Test 4: Simular datos de alerta...', 'info');
                const sampleAlert = {
                    id: 1,
                    studentName: 'María García',
                    grade: '11°',
                    date: '24/07/2026',
                    type: 'Evaluación psicológica',
                    extract: 'Evaluación Alto. Puntaje 18. Niveles elevados de ansiedad...',
                    riskLevel: 'high',
                    status: 'pending',
                    remoteId: 'test_123',
                    notes: ''
                };
                
                addCode(JSON.stringify(sampleAlert, null, 2));
                addResult('✓ Estructura de alerta correcta', 'success');
                
                // Test 5: Check CSS
                addResult('Test 5: Verificar estilos CSS...', 'info');
                const link = document.querySelector('link[href="css/alerts.css"]');
                if (link) {
                    addResult('✓ CSS alerts.css cargado', 'success');
                } else {
                    addResult('✗ CSS alerts.css no cargado', 'error');
                }
                
                addResult('=== Pruebas completadas ===', 'info');
                addResult('Para ver la funcionalidad completa, abre alerts.html en un navegador web.', 'info');
                
            } else {
                addResult('✗ AlertsModule no está definido', 'error');
            }
        };
        
        script.onerror = () => {
            addResult('✗ Error al cargar alerts.js', 'error');
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
